name: glimmer

# ============================================================================
# 面板反代场景（1Panel / 宝塔 / 宿主机已有 Nginx）的部署编排
# ============================================================================
# 与 docker-compose.yml 的唯一区别：**端口只绑定回环地址**，不直接对外，
# 全部流量由面板自带的 OpenResty 转发进来。
#
# 用法（与 docker-compose.yml 二选一，不要同时跑）：
#   docker compose -f docker-compose.1panel.yml up -d --build
#   docker compose -f docker-compose.1panel.yml logs -f glimmer-web
#
# 两者共用项目名 `glimmer` 与容器名，切换时 compose 会自动移除多出来的容器；
# 数据都在宿主机的 ./glimmer-data，不会丢。
#
# ---------------------------------------------------------------------------
# 面板侧配置
# ---------------------------------------------------------------------------
# 【最少配置】只需要一条反向代理规则：
#      路径 /  →  http://127.0.0.1:3001
#   因为 glimmer-web 自己会把 /api 与 /files 转发给 API（自带代理），
#   所以面板不必再为这两个路径单独写 location。
#
# 【推荐配置】多写两条可以少一跳、也便于分别限速：
#      路径 /      →  http://127.0.0.1:3001   前端
#      路径 /api   →  http://127.0.0.1:3000   API
#      路径 /files →  http://127.0.0.1:3000   图片直链（走 API 时访问统计才完整）
#
# 【务必调大上传体积】面板的 OpenResty 默认 client_max_body_size 是 1m，
#   而本项目允许 20MB。在 http 段或该 server 段内加：
#       client_max_body_size 64m;
#   否则超过 1MB 的上传会被面板层直接拦成 413（API 根本收不到请求，容器日志里
#   什么都看不到，很容易误判成后端 bug）。
#
# 【建议放宽上传超时】
#       proxy_read_timeout 300s;
#       proxy_send_timeout 300s;
#       proxy_request_buffering off;
#
# ⚠️ 不要用「静态网站」功能托管 glimmer-web：它是 Nitro node-server 产物，
#    .output/public/ 里只有 _nuxt/ 与 favicon.svg，**没有 index.html**
#    （HTML 入口由 Nitro 运行时生成），必须当普通反代站点使用。
# ============================================================================

services:
  glimmer-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # 镜像来源：默认拉取官方镜像（由 GitHub Actions 自动发布）。
    # 本服务同时声明了 build 与 image 且未写 pull_policy，此时 Compose 的规则是
    # 「先尝试 pull，拉不到才回退本地构建」，所以保留 build 段不影响拉取，
    # 又能在离线或改过源码时用 `docker compose up -d --build` 顶上。
    image: ${IMAGE_PREFIX:-praming/}glimmer-api:${IMAGE_TAG:-latest}
    container_name: glimmer-api
    # .env 是**可选**的：不存在时静默跳过（长语法 + required: false 需 Compose >= 2.24）。
    # 所有配置都有可用默认值，所以不建 .env 也能直接 `docker compose up -d`。
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/data/glimmer/glimmer.db
      - LOCAL_STORAGE_DIR=/data/glimmer/uploads
      - TEMP_DIR=/data/glimmer/tmp
      # 请求头由宿主机上的面板反代覆写，因此可以信任 XFF。
      # ⚠️ 前提是下面的端口只绑 127.0.0.1：一旦改成 0.0.0.0 并放行到公网，
      #    直连者就能伪造 X-Forwarded-For 拆散 IP 维度计数、绕过登录限流，
      #    那种部署必须把本项改为 false。
      - TRUST_PROXY=${TRUST_PROXY:-true}
    volumes:
      - ./glimmer-data:/data/glimmer
    # 注意是 ports 而非 expose：面板的 OpenResty 在宿主机上（或独立网络），
    # 通过宿主机回环访问最稳，无需把面板容器接入 glimmer-net。
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - glimmer-net

  glimmer-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NUXT_PUBLIC_API_BASE=/api
    image: ${IMAGE_PREFIX:-praming/}glimmer-web:${IMAGE_TAG:-latest}
    container_name: glimmer-web
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=/api
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3001
      - API_PROXY_TARGET=http://glimmer-api:3000
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3001}:3001'
    depends_on:
      - glimmer-api
    restart: unless-stopped
    networks:
      - glimmer-net

networks:
  glimmer-net:
    driver: bridge
