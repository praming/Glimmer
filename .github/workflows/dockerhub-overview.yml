name: dockerhub-overview

# 把 docs/dockerhub/ 下的两份 overview 同步到 Docker Hub 对应仓库的「Full description」。
#
# 为什么走 Actions 而不是本地脚本：Docker Hub 的写接口需要 PAT，而本项目约定
# PAT 只存在于仓库 secret 里，不落任何机器。
#
# 触发方式：
#   1) 修改 docs/dockerhub/** 推送到 main → 自动同步（改文案即上线，无需发版）
#   2) Actions 页面手动触发 → 可随时重跑；dry_run 只校验凭据与文件，不提交
#
# ⚠️ 凭据要求（这是本工作流唯一容易卡住的地方）：
#   改仓库介绍属于「仓库元数据编辑」，Docker Hub **拒绝 Read & Write 的 PAT**
#   （返回 403 {"message":"access denied: insufficient scope"}），
#   必须是 **Read, Write, & Delete** 权限的 Personal access token：
#     Docker Hub → 头像 → Account settings → Personal access tokens → Generate new token
#     Access permissions 选「Read, Write, & Delete」
#   取值顺序：DOCKERHUB_OVERVIEW_TOKEN（推荐，专用最小权限）> DOCKERHUB_TOKEN（与镜像发布共用）。
#   若沿用一个 secret，注意镜像发布只要 Read & Write，而本工作流需要更高的那一档。
#
# 与 docker-publish 的关系：本工作流只改仓库介绍文案，不构建、不推送镜像 ——
# publish 的 paths 只认 apps/** 等构建相关路径，因此不会被这里带起一次镜像发布。

on:
  push:
    branches:
      - main
    paths:
      - 'docs/dockerhub/**'
      - '.github/workflows/dockerhub-overview.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只校验凭据与文档，不实际提交'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

concurrency:
  group: dockerhub-overview
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            short: '浮光图床后端 API：Hono + SQLite + sharp，支持本地 / S3 / WebDAV 多后端；需与 glimmer-web 成对部署'
          - service: web
            short: '浮光图床前端页面（Nuxt 3 SPA）+ 内置同源反向代理，唯一对外端口；需与 glimmer-api 成对部署'
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN || secrets.DOCKERHUB_TOKEN }}
      TOKEN_SOURCE: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN && 'DOCKERHUB_OVERVIEW_TOKEN' || 'DOCKERHUB_TOKEN' }}
      REPO: glimmer-${{ matrix.service }}
      DOC: docs/dockerhub/glimmer-${{ matrix.service }}.md
      SHORT: ${{ matrix.short }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # secret 名写错时，登录只会抛一句含糊的 401，先自己检查一遍
      - name: 检查凭据与文档
        run: |
          missing=""
          [ -z "$DH_USER" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_OVERVIEW_TOKEN(或 DOCKERHUB_TOKEN)"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret：${missing# }"
            exit 1
          fi
          [ -f "$DOC" ] || { echo "::error::找不到文档 $DOC"; exit 1; }
          echo "凭据来源：$TOKEN_SOURCE（Docker Hub 用户 $DH_USER）"
          echo "待同步：$DOC（$(wc -c < "$DOC") 字节）→ $DH_USER/$REPO"
          echo "标题行：$(head -1 "$DOC")"

      - name: 登录 Docker Hub
        run: |
          set -e
          token=$(curl -fsS -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$DH_USER" --arg p "$DH_TOKEN" '{username:$u,password:$p}')" \
            | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "::error::Docker Hub 登录失败 —— 凭据必须是 Personal access token，不能用登录密码"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "DH_JWT=$token" >> "$GITHUB_ENV"
          echo "登录成功（JWT 已获取并掩码）"

      - name: 同步 Full description
        run: |
          set -e
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true，跳过提交。payload 演示（前 120 字符）："
            jq -Rs '{full_description: .}' "$DOC" | cut -c1-120
            exit 0
          fi

          # -Rs：把整份 markdown 当成一个 JSON 字符串，换行由 jq 转义，payload 始终是单行
          payload=$(jq -Rs '{full_description: .}' "$DOC")

          # 两种认证都试一遍：先用 /users/login/ 换来的 JWT（官方文档的写法），
          # 若被拒再直接把 PAT 当 Bearer ——不同代的令牌在这套接口上表现并不一致。
          try_patch() {
            curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH \
              "https://hub.docker.com/v2/repositories/$DH_USER/$REPO/" \
              -H "Authorization: $1" \
              -H 'Content-Type: application/json' \
              --data-binary "$payload"
          }

          auth=""
          code=000
          for candidate in "JWT $DH_JWT" "Bearer $DH_TOKEN"; do
            code=$(try_patch "$candidate")
            echo "PATCH $DH_USER/$REPO（$(echo "$candidate" | cut -d' ' -f1) 认证）→ HTTP $code"
            if [ "$code" = "200" ]; then auth="$candidate"; break; fi
            cat /tmp/resp.json 2>/dev/null || true
            echo
          done

          if [ -z "$auth" ]; then
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::权限不足：请把 $TOKEN_SOURCE 换成「Read, Write, & Delete」权限的 PAT"
              echo "Docker Hub 明确拒绝 Read & Write 的 PAT 修改仓库介绍（access denied: insufficient scope）。"
              echo "头像 → Account settings → Personal access tokens → Generate new token，"
              echo "Access permissions 选「Read, Write, & Delete」，然后更新仓库 secret 并重跑本工作流。"
            fi
            exit 1
          fi
          echo "::add-mask::$DH_TOKEN"
          echo "DH_AUTH=$auth" >> "$GITHUB_ENV"

      # 简介（搜索结果里显示的那一行）。它是可选字段，个别账号/仓库模型可能不接受，
      # 因此单独一个请求，失败了也只告警不中断 —— 正文才是必须同步的部分。
      - name: 同步 Short description（可选，失败不中断）
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          payload=$(jq -nc --arg d "$SHORT" '{description: $d}')
          code=$(curl -sS -o /tmp/resp2.json -w '%{http_code}' -X PATCH \
            "https://hub.docker.com/v2/repositories/$DH_USER/$REPO/" \
            -H "Authorization: $DH_AUTH" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")
          echo "PATCH $DH_USER/$REPO/description → HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/resp2.json 2>/dev/null || true
            echo "::warning::简介未同步（HTTP $code）—— 正文已同步，可稍后在 Docker Hub 网页里手填这一行"
          fi

      # 读回公开接口做复核：避免出现「请求 200 但内容没变」这种最难排查的假成功
      - name: 读回复核
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          actual=$(curl -fsS "https://hub.docker.com/v2/repositories/$DH_USER/$REPO/" | jq -r '.full_description // ""')
          want=$(cat "$DOC")
          # 只忽略「行尾空白」的差异，其余必须逐字一致
          actual="${actual%"${actual##*[![:space:]]}"}"
          want="${want%"${want##*[![:space:]]}"}"
          if [ "$actual" = "$want" ]; then
            echo "✅ $DH_USER/$REPO 的 overview 与 $DOC 逐字一致（$(printf '%s' "$actual" | wc -c) 字节）"
          else
            echo "::error::读回内容与本地文件不一致（远端 $(printf '%s' "$actual" | wc -c) 字节 / 本地 $(wc -c < "$DOC") 字节）"
            exit 1
          fi
