name: dockerhub-overview

# 把 docs/dockerhub/ 下的两份 overview 同步到 Docker Hub 对应仓库的「Full description」。
#
# 为什么走 Actions 而不是本地脚本：Docker Hub 的写接口需要 PAT，而本项目约定
# PAT 只存在于仓库 secret 里，不落任何机器。
#
# 触发方式：
#   1) 修改 docs/dockerhub/** 推送到 main → 自动同步（改文案即上线，无需发版）
#   2) Actions 页面手动触发 → 可随时重跑；dry_run 只校验凭据与文件，不提交
#
# ── 凭据取值的顺序 ──────────────────────────────────────────────
#   DOCKERHUB_OVERVIEW_TOKEN（可选，推荐）> DOCKERHUB_TOKEN（与镜像发布共用）
#   分开是为了最小权限：推镜像只需 Read & Write，而改仓库介绍属于「仓库元数据编辑」，
#   Docker Hub 对 Write 档的 PAT 直接返回：
#       403 {"message":"access denied: insufficient scope"}
#   所以这个专用令牌要选 **Read, Write, & Delete** 权限：
#     头像 → Account settings → Personal access tokens → Generate new token
#
# ── 取令牌也不止一种流程（实测差异很大，故全部尝试） ─────────────
#   a) POST /v2/auth/token  {identifier, secret} → access_token（当前文档推荐，短效）
#   b) POST /v2/users/login/            → JWT（旧版；开启 2FA 的账号会被拒）
#   PATCH 时依次尝试「新令牌 + 经典路由」「旧 JWT + 经典路由」「新令牌 + 命名空间路由」，
#   任一条 200 即成功。三条都失败才报错，并打印可执行的补救步骤。
#
# 与 docker-publish 的关系：本工作流只改仓库介绍文案，不构建、不推送镜像 ——
# publish 的 paths 只认 apps/** 等构建相关路径，因此不会被这里带起一次镜像发布。

on:
  push:
    branches:
      - main
    paths:
      - 'docs/dockerhub/**'
      - '.github/workflows/dockerhub-overview.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只校验凭据与文档，不实际提交'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

concurrency:
  group: dockerhub-overview
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ short 是仓库「简介」，Docker Hub 硬限制 **100 字节**（中文按 UTF-8 算 3 字节）。
        # 首次同步时写成 119 / 121 字节，被接口一句 400 挡回：
        #   {"fielderrors":{"description":"Exceeded max number of bytes 100 - actual 119"}}
        # 保持每条 ≤ 100 字节并在下面用 iconv 截断兜底，改动时请一并复核。
        include:
          - service: api
            short: '后端 API（Hono + SQLite + sharp），多后端，需与 glimmer-web 成对部署'
          - service: web
            short: '前端页面（Nuxt 3 SPA）+ 同源代理，需与 glimmer-api 成对部署'
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN || secrets.DOCKERHUB_TOKEN }}
      TOKEN_SOURCE: ${{ secrets.DOCKERHUB_OVERVIEW_TOKEN && 'DOCKERHUB_OVERVIEW_TOKEN' || 'DOCKERHUB_TOKEN' }}
      REPO: glimmer-${{ matrix.service }}
      DOC: docs/dockerhub/glimmer-${{ matrix.service }}.md
      SHORT: ${{ matrix.short }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # secret 名写错时只会抛一句含糊的 401，先自己检查一遍
      - name: 检查凭据与文档
        run: |
          missing=""
          [ -z "$DH_USER" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_OVERVIEW_TOKEN(或 DOCKERHUB_TOKEN)"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret：${missing# }"
            exit 1
          fi
          [ -f "$DOC" ] || { echo "::error::找不到文档 $DOC"; exit 1; }
          echo "凭据来源：$TOKEN_SOURCE（Docker Hub 用户 $DH_USER）"
          echo "待同步：$DOC（$(wc -c < "$DOC") 字节）→ $DH_USER/$REPO"
          echo "标题行：$(head -1 "$DOC")"

      - name: 获取访问令牌（两种流程都试）
        run: |
          set -e
          # a) 当前文档推荐的流程：账号 + PAT 换一个短效 access_token
          access=$(curl -sS -X POST https://hub.docker.com/v2/auth/token \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg i "$DH_USER" --arg s "$DH_TOKEN" '{identifier:$i,secret:$s}')" \
            | jq -r '.access_token // empty')
          if [ -n "$access" ]; then
            echo "::add-mask::$access"
            echo "DH_ACCESS=$access" >> "$GITHUB_ENV"
            echo "已通过 /v2/auth/token 换取短效访问令牌"
          else
            echo "::warning::/v2/auth/token 未返回 access_token，将只依赖旧版登录流程"
          fi

          # b) 旧流程：/v2/users/login/ 换 JWT（2FA 账号可能被拒）
          jwt=$(curl -sS -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$DH_USER" --arg p "$DH_TOKEN" '{username:$u,password:$p}')" \
            | jq -r '.token // empty')
          if [ -n "$jwt" ]; then
            echo "::add-mask::$jwt"
            echo "DH_JWT=$jwt" >> "$GITHUB_ENV"
            echo "已通过 /v2/users/login/ 获取 JWT"
          fi

          if [ -z "$access" ] && [ -z "$jwt" ]; then
            echo "::error::两种取令牌的方式都失败 —— 请确认凭据是有效的 Personal access token（不能用登录密码）"
            exit 1
          fi

      - name: 同步 Full description
        run: |
          set -e
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true，跳过提交。payload 演示（前 120 字符）："
            jq -Rs '{full_description: .}' "$DOC" | cut -c1-120
            exit 0
          fi

          # -Rs：把整份 markdown 当成一个 JSON 字符串，换行由 jq 转义，payload 始终是单行
          payload=$(jq -Rs '{full_description: .}' "$DOC")
          last_code=000
          last_url=""

          # $1=说明 $2=Authorization 头（空则跳过）$3=URL
          attempt() {
            [ -z "$2" ] && return 1
            last_url="$3"
            last_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH "$3" \
              -H "Authorization: $2" \
              -H 'Content-Type: application/json' \
              --data-binary "$payload")
            echo "尝试「$1」→ HTTP $last_code"
            if [ "$last_code" = "200" ]; then
              echo "DH_AUTH=$2" >> "$GITHUB_ENV"
              return 0
            fi
            cat /tmp/resp.json 2>/dev/null || true
            echo
            return 1
          }

          classic="https://hub.docker.com/v2/repositories/$DH_USER/$REPO/"
          namespaced="https://hub.docker.com/v2/namespaces/$DH_USER/repositories/$REPO"

          ok=0
          if attempt "新令牌 + 经典路由" "Bearer $DH_ACCESS" "$classic"; then ok=1; fi
          if [ "$ok" = "0" ]; then
            if attempt "旧 JWT + 经典路由" "JWT $DH_JWT" "$classic"; then ok=1; fi
          fi
          if [ "$ok" = "0" ]; then
            if attempt "新令牌 + 命名空间路由" "Bearer $DH_ACCESS" "$namespaced"; then ok=1; fi
          fi

          if [ "$ok" = "0" ]; then
            echo "::error::三条提交路径全部失败（最后一条 $last_url → HTTP $last_code）"
            if [ "$last_code" = "401" ] || [ "$last_code" = "403" ]; then
              echo "Docker Hub 对「仓库元数据编辑」不接受 Read & Write 档的 PAT（access denied: insufficient scope）。"
              echo "请到 Docker Hub → 头像 → Account settings → Personal access tokens 新建一个"
              echo "Access permissions 为「Read, Write, & Delete」的令牌，写入仓库 secret $TOKEN_SOURCE 后重跑本工作流。"
            fi
            exit 1
          fi

      # 简介（搜索结果里显示的那一行）。它是可选字段，个别账号/仓库模型可能不接受，
      # 因此单独一个请求，失败了也只告警不中断 —— 正文才是必须同步的部分。
      - name: 同步 Short description（可选，失败不中断）
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          # 简介硬限 100 字节，超长会 400。先按字节截到 100，再用 iconv -c 丢掉可能被
          # 切掉一半的 UTF-8 字符（否则 jq 会因非法编码直接失败）。
          short="$SHORT"
          bytes=$(printf '%s' "$short" | wc -c)
          if [ "$bytes" -gt 100 ]; then
            short=$(printf '%s' "$short" | head -c 100 | iconv -f UTF-8 -t UTF-8 -c)
            echo "::warning::简介超长（${bytes} 字节 > 100），已截断为：$short"
          fi
          payload=$(jq -nc --arg d "$short" '{description: $d}')
          code=$(curl -sS -o /tmp/resp2.json -w '%{http_code}' -X PATCH \
            "https://hub.docker.com/v2/repositories/$DH_USER/$REPO/" \
            -H "Authorization: $DH_AUTH" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")
          echo "PATCH $DH_USER/$REPO/description → HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/resp2.json 2>/dev/null || true
            echo "::warning::简介未同步（HTTP $code）—— 正文已同步，可稍后在 Docker Hub 网页里手填这一行"
          fi

      # 读回公开接口做复核：避免出现「请求 200 但内容没变」这种最难排查的假成功
      - name: 读回复核
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          actual=$(curl -fsS "https://hub.docker.com/v2/repositories/$DH_USER/$REPO/" | jq -r '.full_description // ""')
          want=$(cat "$DOC")
          # 只忽略「行尾空白」的差异，其余必须逐字一致
          actual="${actual%"${actual##*[![:space:]]}"}"
          want="${want%"${want##*[![:space:]]}"}"
          if [ "$actual" = "$want" ]; then
            echo "✅ $DH_USER/$REPO 的 overview 与 $DOC 逐字一致（$(printf '%s' "$actual" | wc -c) 字节）"
          else
            echo "::error::读回内容与本地文件不一致（远端 $(printf '%s' "$actual" | wc -c) 字节 / 本地 $(wc -c < "$DOC") 字节）"
            exit 1
          fi
