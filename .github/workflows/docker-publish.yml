name: docker-publish

# 把镜像发布到 Docker Hub，供他人直接 `docker pull` 部署。
#
# 触发方式：
#   1) 推送 v* 标签（如 v1.0.0）→ 构建并推送该版本号 + latest
#   2) 推送到 main 分支 → 构建并推送 latest（仅当构建相关文件变化时）
#   3) Actions 页面手动触发 → 可自定义标签
#
# 前置条件（只需配一次）：
#   GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret
#     DOCKERHUB_USERNAME   Docker Hub 用户名
#     DOCKERHUB_TOKEN      在 Docker Hub → Account settings → Personal access tokens 生成
#                          （读写权限即可；不要用登录密码，Docker Hub 已不支持密码推送）
#
# 说明：Docker Hub 自带的 Automated Builds 已于 2026-05 宣布废弃（2027-04-01 完全停用），
#       且要求付费订阅、免 PAT 的 OIDC 登录也只对付费组织开放 —— 所以这里用 GitHub Actions，
#       它同时也是 Docker 官方给出的迁移方案，并且能用一个仓库构建多个镜像（Docker Hub 原生做不到）。

on:
  push:
    branches:
      - main
    paths:
      # 只在真正影响镜像内容的路径变化时构建，避免改个 README 也跑 CI
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空则用 latest）'
        required: false
        default: ''
      push:
        description: '是否推送到 Docker Hub；选 false 表示只验证镜像能否构建成功（不需要凭据）'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

# 同一时刻只跑一个，避免连续推送时互相覆盖
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # 三种触发源的标签推导：
  #   手动触发 → 用输入值（留空则 latest）
  #   标签推送 → 用标签名（v1.0.0）
  #   分支推送 → latest
  # 注意不能简单写 `github.event.inputs.tag || github.ref_name`：手动触发留空时会退化成分支名 main。
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || 'latest') || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest') }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 需要 linux/arm64 时打开（构建耗时明显增加，QEMU 模拟下 sharp/native 会慢很多）
      # - uses: docker/setup-qemu-action@v3

      # 缺少 / 写错 secret 名时，docker/login-action 只会抛一句
      # "Username and password required"，不容易看出是配置问题，这里先自己检查一遍。
      - name: 检查 Docker Hub 凭据
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push != 'false' }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DH_USER" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret：${missing# }"
            echo "Settings → Secrets and variables → Actions → New repository secret，"
            echo "需要两个「名称完全一致」的 secret：DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN。"
            exit 1
          fi
          echo "凭据已就绪，Docker Hub 用户：$DH_USER"

      - name: 登录 Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 glimmer-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 需要多架构时改成 linux/amd64,linux/arm64 并启用上面的 qemu
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push != 'false' }}
          # 用户名取不到时（例如只构建不推送的验证运行）必须有个合法占位，
          # 否则标签会拼成 "/glimmer-api:latest"，buildx 会以
          # "invalid reference format" 直接退出，连构建都不会开始。
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'glimmer-local' }}/glimmer-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME || 'glimmer-local' }}/glimmer-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
