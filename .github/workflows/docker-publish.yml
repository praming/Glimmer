name: docker-publish

# 本机没装 Docker 也能发布镜像：打一个 v 开头的 tag 推到 GitHub，
# 这里会自动构建并推送到 Docker Hub。
#
# 前置：仓库 Settings → Secrets and variables → Actions 添加两个 secret
#   DOCKERHUB_USERNAME   Docker Hub 用户名
#   DOCKERHUB_TOKEN      在 Docker Hub → Account Settings → Personal access tokens 生成
# （不要用登录密码，Docker Hub 已不支持密码推送。）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空则用 latest）'
        required: false
        default: latest

env:
  # 两个镜像共用同一版本号，避免手工漏推一个
  IMAGE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 需要 linux/arm64 时打开（构建耗时明显增加）
      # - uses: docker/setup-qemu-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 glimmer-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 需要多架构时改成 linux/amd64,linux/arm64 并启用上面的 qemu
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/glimmer-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/glimmer-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
