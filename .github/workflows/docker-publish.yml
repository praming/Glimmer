name: docker-publish

# 把镜像发布到 Docker Hub，供他人直接 `docker pull` 部署。
#
# 触发方式：
#   1) 推送 v* 标签（如 v1.0.0）→ 构建并推送该版本号 + latest
#   2) 推送到 main 分支 → 构建并推送 latest（仅当构建相关文件变化时）
#   3) Actions 页面手动触发 → 可自定义标签
#
# 前置条件（只需配一次）：
#   GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret
#     DOCKERHUB_USERNAME   Docker Hub 用户名
#     DOCKERHUB_TOKEN      在 Docker Hub → Account settings → Personal access tokens 生成
#                          （读写权限即可；不要用登录密码，Docker Hub 已不支持密码推送）
#
# 说明：Docker Hub 自带的 Automated Builds 已于 2026-05 宣布废弃（2027-04-01 完全停用），
#       且要求付费订阅、免 PAT 的 OIDC 登录也只对付费组织开放 —— 所以这里用 GitHub Actions，
#       它同时也是 Docker 官方给出的迁移方案，并且能用一个仓库构建多个镜像（Docker Hub 原生做不到）。

on:
  push:
    branches:
      - main
    paths:
      # 只在真正影响镜像内容的路径变化时构建，避免改个 README 也跑 CI
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空则用 latest）'
        required: false
        default: ''
      push:
        description: '是否推送到 Docker Hub；选 false 表示只验证镜像能否构建成功（不需要凭据）'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

# 同一时刻只跑一个，避免连续推送时互相覆盖
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

# 镜像标签不在这里定义：它要去掉 git tag 的 `v` 前缀（v1.0.0 → 镜像 1.0.0，
# 与 README 的承诺一致），而 `env:` 里只能用单行表达式、没有字符串替换函数，
# 所以挪到 publish job 的第一步用 shell 推导（见「推导镜像标签」）。

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # 镜像标签的三种来源：
      #   手动触发 → 用输入值（留空则 latest）
      #   tag 推送 → 去掉 `v` 前缀的版本号（v1.0.0 → 1.0.0）
      #   分支推送 → latest
      # 注意不能简单写 `github.event.inputs.tag || github.ref_name`：
      #   手动触发留空时会退化成分支名 main；tag 推送则会把 `v1.0.0` 原样当成镜像标签。
      # 写入 $GITHUB_ENV 后，后续步骤的 `${{ env.IMAGE_TAG }}` 即可读到。
      - name: 推导镜像标签
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            [ -z "$tag" ] && tag=latest
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            tag="${tag#v}"
          else
            tag=latest
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "镜像标签：$tag"

      - uses: docker/setup-buildx-action@v3

      # 需要 linux/arm64 时打开（构建耗时明显增加，QEMU 模拟下 sharp/native 会慢很多）
      # - uses: docker/setup-qemu-action@v3

      # 缺少 / 写错 secret 名时，docker/login-action 只会抛一句
      # "Username and password required"，不容易看出是配置问题，这里先自己检查一遍。
      - name: 检查 Docker Hub 凭据
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push != 'false' }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DH_USER" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret：${missing# }"
            echo "Settings → Secrets and variables → Actions → New repository secret，"
            echo "需要两个「名称完全一致」的 secret：DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN。"
            exit 1
          fi
          echo "凭据已就绪，Docker Hub 用户：$DH_USER"

      - name: 登录 Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 glimmer-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 需要多架构时改成 linux/amd64,linux/arm64 并启用上面的 qemu
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push != 'false' }}
          # 用户名取不到时（例如只构建不推送的验证运行）必须有个合法占位，
          # 否则标签会拼成 "/glimmer-api:latest"，buildx 会以
          # "invalid reference format" 直接退出，连构建都不会开始。
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'glimmer-local' }}/glimmer-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME || 'glimmer-local' }}/glimmer-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ---------------------------------------------------------------------------
  # 冒烟：把刚发布的镜像真的拉下来跑起来探活。
  #
  # 「能构建 + 能推送」不等于「能启动」。换基础镜像（例如 web 用 musl 的 alpine）、
  # 裁剪运行时依赖这类改动，只有容器真的起来并响应过才算验证过 —— 否则问题会一路
  # 潜伏到用户 `docker compose up` 的那一刻。这里顺带打印镜像体积，便于追踪瘦身效果。
  #
  # 仅在「确实推送了镜像」时运行：只构建不推送的验证运行（push=false）会跳过，
  # 否则会去拉上一次发布的 latest，验的是旧镜像，结论具有误导性。
  # ---------------------------------------------------------------------------
  smoke:
    needs: publish
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.push != 'false' }}
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: 拉取刚发布的镜像
        run: |
          docker pull "$DH_USER/glimmer-api:latest"
          docker pull "$DH_USER/glimmer-web:latest"

      - name: 报告镜像体积
        run: |
          {
            echo "### 镜像体积"
            echo ""
            echo "| 镜像 | 未压缩（\`docker images\`） | 压缩后（\`docker pull\` 实下） |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for svc in api web; do
            ref="$DH_USER/glimmer-$svc:latest"
            size=$(docker image inspect --format '{{.Size}}' "$ref")

            # 压缩后体积 = manifest 里各层 size 之和，也就是 docker pull 真正下载的字节数。
            # buildx 推的是 manifest list，先取第一个子 manifest 的 digest 再算。
            raw=$(docker buildx imagetools inspect --raw "$ref")
            if echo "$raw" | jq -e 'has("manifests")' > /dev/null 2>&1; then
              digest=$(echo "$raw" | jq -r '.manifests[0].digest')
              raw=$(docker buildx imagetools inspect --raw "$DH_USER/glimmer-$svc@$digest")
            fi
            packed=$(echo "$raw" | jq '[.layers[].size] | add')

            umb=$(( size / 1048576 ))
            pmb=$(( packed / 1048576 ))
            echo "glimmer-$svc: 未压缩 ${umb} MB / 压缩后 ${pmb} MB"
            echo "| glimmer-$svc:latest | ${umb} MB | ${pmb} MB |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 启动 API 并探活
        run: |
          set -e
          # 刻意**不**注入 ENCRYPTION_KEY：走「首次启动自动生成并落盘」这条真实路径，
          # 并在下面断言日志里确实出现了生成提示。
          docker run -d --name smoke-api -p 3000:3000 \
            -e ADMIN_PASSWORD=smoke-test-password \
            -e COOKIE_SECURE=false \
            -e PUBLIC_BASE_URL=http://127.0.0.1:3000 \
            "$DH_USER/glimmer-api:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo
              echo "API 健康检查通过（第 ${i} 次尝试）"
              if docker logs smoke-api 2>&1 | grep -q "已自动生成并保存到"; then
                echo "ENCRYPTION_KEY 自动生成并落盘：已验证"
              else
                echo "::error::日志里没有出现密钥自动生成的提示，落盘逻辑可能未生效"
                docker logs smoke-api
                exit 1
              fi
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke-api)" != "true" ]; then
              echo "::error::API 容器已退出"
              exit 1
            fi
            sleep 2
          done
          echo "::error::API 未在 60 秒内通过健康检查"
          exit 1

      - name: 启动 Web 并确认 HTTP 有响应
        run: |
          set -e
          docker run -d --name smoke-web -p 3001:3001 -e NODE_ENV=production "$DH_USER/glimmer-web:latest"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3001/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Web 已响应 HTTP $code（第 ${i} 次尝试）"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke-web)" != "true" ]; then
              echo "::error::Web 容器已退出"
              exit 1
            fi
            sleep 2
          done
          echo "::error::Web 未在 60 秒内响应"
          exit 1

      - name: 失败时输出容器日志
        if: failure()
        run: |
          for c in smoke-api smoke-web; do
            echo "========== $c =========="
            docker logs "$c" 2>&1 | tail -80 || true
          done
